# rRNA (barrnap) + tRNA (tRNAscan-SE) for the MIMAG high-quality criterion.
# Small, light env; Echidna is dependency-free and pip-installed alongside.
name: echidna-mimag
channels:
  - conda-forge
  - bioconda
dependencies:
  - barrnap
  - trnascan-se
  - pip
  - pip:
      # Until published to PyPI, replace `echidna` with: -e /absolute/path/to/echidna
      - echidna
