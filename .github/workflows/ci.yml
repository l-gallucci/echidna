name: Tests and packaging
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python -m pytest -o addopts='' -q
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest 'snakemake==9.27.1'
      - run: python -m pytest tests/test_snakemake_integration.py -q
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine cffconvert
      - run: cffconvert --validate
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-test/bin/echidna" --help
          "$RUNNER_TEMP/wheel-test/bin/echidna" --version
          "$RUNNER_TEMP/wheel-test/bin/echidna" setup-workflow --export-workflow exported-workflow
          test -f exported-workflow/Snakefile
          test ! -e "$RUNNER_TEMP/wheel-test/bin/echidnaxomics"
