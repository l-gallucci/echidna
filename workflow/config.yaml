# Echidna Snakemake workflow — configuration
#
# Edit the paths below, then run from the repo root:
#   snakemake --use-conda --cores 20 -s workflow/Snakefile --configfile workflow/config.yaml
#
# --use-conda makes Snakemake build one conda env per rule (envs/*.yaml) on the
# first run, so the conflicting tools (checkm2 / gtdbtk / gunc) never share an env.

# Input: directory of MAG/genome FASTA files (one genome per file)
genomes_dir: "bins"
genome_ext: "fa"            # extension without the dot

# Optional reused per-contig classifications from classify-contigs (NOT .bins.tsv).
# Contains sequence_sha256, contig_length, taxonomy_rank and rank_taxon.
# Reaggregate old classifier output with classify-contigs to add fingerprints.
contig_taxonomy: ""
taxonomy_rank: "order"       # must match the table's rank
min_foreign_frac: 0.05      # minority fraction of resolved bases, same as check-chimeras
min_taxonomy_resolved_frac: 0.5  # resolved bases / all MAG bases; overlap acceptance gate

# Optional selection BEFORE all final quality/taxonomy/RNA/chimera checks.
# Blank preserves the original workflow. Modes: exclude-mags | remove-contigs.
# Both quality and sequence-linked contig_taxonomy tables are required.
overlap_resolution: ""
overlap_quality_report: ""  # prior quality for representatives AND alternatives
overlap_rank_by: "completeness"
overlap_drep_dir: ""        # reads data_tables/Cdb.csv secondary clusters
overlap_cluster_table: ""   # alternative to overlap_drep_dir: genome,cluster TSV/CSV
overlap_candidates_dirs: [] # original pre-dereplication FASTAs, e.g. ["all_mags"]

# Output root
outdir: "results"

# Resources
threads: 20

# Reference databases (required by the matching tool)
gtdbtk_data: "/path/to/gtdbtk_data"                               # $GTDBTK_DATA_PATH
gunc_db: "/path/to/gunc_db/gunc_db_gtdb214.dmnd"                  # GUNC .dmnd; gtdb_214 recommended for environmental MAGs (progenomes_2.1 is isolate-biased)
checkm2_db: ""                                                     # optional; blank = CheckM2 default

# organize-mags renaming
sample_regex: "^([^._]+)"   # capture group 1 = sample id from the filename
tax_level: "genus"          # rank used in the renamed output

# MIMAG rRNA/tRNA high-quality gate (barrnap + tRNAscan-SE)
# Set to false to skip the rRNA/tRNA step; HQ is then comp/cont only.
mimag_rna: true
mimag_kingdom: "bac"        # bac | arc | euk (barrnap/tRNAscan-SE kingdom)

# Pass --skip-existing to run-gtdbtk (reuse an existing gtdbtk.*.summary.tsv).
# NOTE: Snakemake deletes a rule's output dir before re-running it, so this mainly
# helps standalone/`conda run` use. To truly reuse results in the workflow, place
# them at <outdir>/gtdbtk and keep them newer than all input FASTAs so Snakemake skips
# the job entirely.
gtdbtk_skip_existing: true

# ── Environment mode ────────────────────────────────────────────────────────
# Two ways to supply the conflicting tools:
#   use_named_envs: false  → run `snakemake --use-conda`; Snakemake builds one
#                            env per rule from envs/*.yaml (default).
#   use_named_envs: true   → run plain `snakemake` (NO --use-conda); each rule is
#                            wrapped in `conda run -n <env_*>` using YOUR envs.
# `echidna setup-workflow --gunc-env ... --checkm2-env ...` sets these for you.
use_named_envs: false
env_echidna: ""     # light CLI tools + Echidna (organize-mags, check-chimeras)
env_checkm2: ""    # CheckM2
env_gtdbtk: ""     # GTDB-Tk
env_gunc: ""       # GUNC
env_mimag: ""      # barrnap + tRNAscan-SE (run-mimag-rna)
